spring.application.name=Quizcraft
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/quizcraft;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
quizcraft.seed-demo=${SEED_DEMO:true}
quizcraft.demo-password=${DEMO_PASSWORD:JavaLab@123}
quizcraft.admin-name=${ADMIN_NAME:Administrator}
quizcraft.admin-email=${ADMIN_EMAIL:}
quizcraft.admin-password=${ADMIN_PASSWORD:}
quizcraft.require-admin=false
